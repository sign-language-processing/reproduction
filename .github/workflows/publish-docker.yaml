name: Publish a Docker image

# Builds and publishes the base image only for image tags, never for repository
# releases. To release an image, push a tag image-v<NGC version>.<build> on the
# commit to build, for example image-v26.04.01. The image is tagged v26.04.01
# and :latest. Then update the pinned digest in AGENTS.md (see CONTRIBUTING.md).
on:
  push:
    tags: ['image-v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # image-v26.04.01 -> v26.04.01, the scheme of the existing image tags
          tags: type=match,pattern=image-(v.*),group=1
          flavor: latest=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=registry,compression=estargz,oci-mediatypes=true,force-compression=true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report the digest to pin
        run: |
          echo "Published \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Update the pinned digest in AGENTS.md to this value." >> "$GITHUB_STEP_SUMMARY"
