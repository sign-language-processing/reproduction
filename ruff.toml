# Lint and format only our own tooling. papers/ is excluded because run
# provenance pins the SHA-256 of many paper scripts; reformatting them would
# silently break those records. repositories/ predates the study.
target-version = "py312"
include = [".agents/**/*.py"]
extend-exclude = ["papers", "repositories"]

[lint]
select = ["E4", "E7", "E9", "F"]
